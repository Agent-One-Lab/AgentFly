name: CPU-only Unit Tests (agents)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-envs:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        python-version: ["3.12"]
        test-file:
          - tests/unit/envs/ --ignore=tests/unit/envs/test_scienceworld_env.py
          - tests/unit/rewards/ --ignore=tests/unit/rewards/swe/
          - tests/unit/tools/ --ignore=tests/unit/tools/test_webshop_tool.py --ignore=tests/unit/tools/test_scienceworld_tool.py
          - tests/unit/resources/
          - tests/unit/skills/
          # - tests/unit/agents/  # skipped: complex, some tests require GPUs

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Python
        run: |
          which python
          python --version
          which pip
          python -m pip --version

      - name: Free up disk space
        run: |
          echo "Before cleanup:"
          df -h

          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true

          echo "After cleanup:"
          df -h

      - name: Install dependencies (main repo)
        run: |
          pip install -e .
          # Pin datasets: 2.14.x uses pyarrow's removed PyExtensionType and breaks
          # on import; keep in sync with the pin in pyproject.toml's [verl] extra.
          pip install 'datasets==2.19.0'
          pip install -e '.[dev]' --no-build-isolation

      - name: Cache AgentFly cache
        uses: actions/cache@v4
        with:
          path: ~/.agentfly/cache
          key: ${{ runner.os }}-agentfly-cache-v2
          restore-keys: |
            ${{ runner.os }}-agentfly-cache-v2

      - name: Install enroot
        run: |
          mkdir -p ~/enroot-packages
          cd ~/enroot-packages
          arch=$(dpkg --print-architecture)
          if [ ! -f enroot_3.5.0-1_${arch}.deb ]; then
            curl -fSsL -O https://github.com/NVIDIA/enroot/releases/download/v3.5.0/enroot_3.5.0-1_${arch}.deb
            curl -fSsL -O https://github.com/NVIDIA/enroot/releases/download/v3.5.0/enroot+caps_3.5.0-1_${arch}.deb
          fi
          sudo apt-get update
          sudo apt-get install -y ./*.deb

      - name: Run unit test (${{ matrix.test-file }})
        run: |
          pytest -m "not gpu" ${{ matrix.test-file }}
