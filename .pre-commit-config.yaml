exclude: 'docs/|agentfly/verl/|verl/|tests/'

repos:
  # 1. General Sanity Checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace      # Removes unnecessary spaces at ends of lines
        exclude: \.py$  # ruff-format handles Python and, unlike this hook, never edits string contents (prompts)
      - id: end-of-file-fixer        # Ensures files end with a newline
      - id: check-yaml               # Validates your YAML files
        exclude: ^mkdocs\.yml$  # Exclude mkdocs.yml (contains Python tags)
      - id: check-added-large-files  # Prevents accidentally committing giant files

  # 2. Lint (incl. import sorting) and format. Rules live in pyproject.toml [tool.ruff];
  #    verl/ and dockers/ are excluded there (the hooks pass --force-exclude).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: ^src/.*\.py$
      - id: ruff-format
        files: ^src/.*\.py$
