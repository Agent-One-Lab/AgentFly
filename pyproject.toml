[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "gpu: marks tests as requiring GPU resources"
]

[tool.setuptools]
packages = ["agentfly"]
package-dir = {"" = "src"}

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["agentfly"]
skip_glob = ["*/verl/*"]

[tool.ruff.lint]
# Disable import checking - let isort handle it
ignore = ["I"]

[tool.uv]
# The CUDA / vLLM stack ships Linux-x86_64 wheels only; restrict lock resolution
# to that platform so `uv lock` doesn't try (and fail) to solve for macOS/Windows.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# liger-kernel and flash-attn (in the `verl` extra) build against an
# already-installed torch; they must skip build isolation. Only relevant when
# `--extra verl` is requested.
no-build-isolation-package = ["liger-kernel", "flash-attn"]
# vllm 0.19.0 leaves xgrammar unpinned; xgrammar 0.2.4+ dropped the cp312
# linux-x86_64 wheel (and ships no sdist), so uv's "install the highest" pick
# fails on Python 3.12. Hold the known-good version the reference env runs.
constraint-dependencies = ["xgrammar==0.2.2"]


[project]
name = "AgentFly"
version = "0.2.0"
description = "Agent reinforcement learning framework."
readme = "README.md"
requires-python = ">=3.12,<3.13" # Python 3.12.x
license = { text = "Apache-2.0" }

dependencies = [
    "multiprocess",
    "requests",
    "PyYAML",
    "timeout-decorator",
    "redis",
    "docker",
    # Pin ray to the version the reference (conda) env trained on. ray 2.57.x
    # hangs verl's agent-loop generation (workers wait forever on the vLLM
    # rollout server); 2.55.1 is the known-good version. Constrains ray[default]
    # in the verl extra too.
    "ray==2.55.1",
    "openai",
    "enroot-py",
    "omegaconf",
    "vllm==0.19.0",
    "termcolor",
    "tenacity",
    "bs4",
    "qwen_vl_utils",
    "onnxruntime",
    "mpmath",
    "wandb",
    "chat-bricks",
    "diffusers",
    "google-genai",
    "chess",
]

[project.scripts]
agentfly = "agentfly.cli:main"

[project.optional-dependencies]
verl = [
    "accelerate",
    "codetiming",
    # 2.14.x still uses pyarrow's removed PyExtensionType; 2.16+ dropped it.
    # Pin to the version the reference env runs (matches known-good pyarrow).
    "datasets==2.19.0",
    "dill",
    # Required by the verl trainer (models load with attn_implementation=
    # "flash_attention_2"). Was never declared before — the conda env had it
    # manually. Pinned to the version the reference env runs. Builds against the
    # installed torch (see no-build-isolation-package in [tool.uv]).
    "flash-attn==2.8.3",
    "hydra-core",
    "liger-kernel",
    "numpy",
    "pandas",
    "peft",
    "pyarrow>=15.0.0",
    "pybind11",
    "pylatexenc",
    "pre-commit",
    "ray[default]",
    "tensordict",
    "torchdata",
    "packaging>=20.0",
    "uvicorn",
    "fastapi"
]
dev = [
    "pytest",
    "nest-asyncio",
    "pytest-asyncio",
    "pre-commit",
]
# Cloud-sandbox container engine (AF_CONTAINER_ENGINE=daytona).
daytona = [
    "daytona>=0.199",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "pymdown-extensions",
    "mkdocs-document-dates",
    "mkdocs-link-preview-plugin",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-git-authors-plugin",
]